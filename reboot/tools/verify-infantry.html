<!doctype html><html lang="uk"><meta charset="utf-8"><title>Піхота та переслідування — без звуку</title><style>#controls{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap;z-index:10}#controls button{font:16px monospace;padding:8px}output{position:fixed;bottom:8px;right:8px;max-width:620px;background:#071723ed;color:#dfe9dc;z-index:10;padding:9px;font:15px monospace}#names{position:fixed;top:22%;left:0;width:100%;display:flex;justify-content:space-evenly;font:14px monospace;z-index:9;color:#fff}</style><canvas id="scene"></canvas><nav id="controls"></nav><div id="names"></div><output></output><script type="module">
import '/src/style.css';import {World,IDLE} from '/src/game/world.ts';import {View} from '/src/game/view.ts';import {Sound} from '/src/game/audio.ts';import {INFANTRY,addInfantry} from '/src/game/infantry.ts';
const view=new View(document.querySelector('canvas')),sound=new Sound(true);let w,frozen=true,log=[];
function base(){w=new World();w.mode='playing';w.enemies=[];w.allies=[];w.mounts=[];w.medkits=[];w.ladders=[];w.boxes=w.boxes.filter(b=>b.y<0);w.player.x=18;w.player.invulnerable=999;log=[];document.querySelector('#names').textContent='';}
function reset(kind){base();addInfantry(w,kind,31);frozen=true;view.reset(w);}
function button(name,fn){const b=document.createElement('button');b.textContent=name;b.onclick=fn;document.querySelector('#controls').append(b);}
for(const [kind,spec] of Object.entries(INFANTRY))button(spec.name,()=>reset(kind));
button('Усі ролі',()=>{base();w.player.x=3;w.player.cloak=999;Object.keys(INFANTRY).forEach((k,i)=>addInfantry(w,k,8+i*4));frozen=true;view.reset(w);document.querySelector('#names').textContent='Мотострілець · ВДВ · Кулеметник · Снайпер · Зв’язківець · Щит · Підривник';});
button('Крок 0.2 с',()=>{for(let i=0;i<12;i++)step();view.reset(w);});button('Рух / пауза',()=>frozen=!frozen);
button('Відійти',()=>{w.player.x-=7;view.reset(w);});button('Підійти',()=>{w.player.x+=6;view.reset(w);});
button('Укриття',()=>{w.boxes.push({id:w.nextId(),x:(w.player.x+w.enemies[0].x)/2,y:0,w:1,h:5,hp:150,maxHp:150,kind:'wall'});view.reset(w);});
button('Здолати',()=>{w.damageEnemy(w.enemies[0],1000);view.reset(w);});
function step(){w.step(1/60,IDLE);for(const e of w.events){view.event(e);sound.event(e,w.player.x);if(['enemyAlert','enemyShot','enemySniperShot','enemyFuse','hostileBlast','enemyReload'].includes(e.type))log.push(e.type);}w.events=[];}
view.onFrame=dt=>{if(!frozen)step();view.render(w,dt,0);document.querySelector('output').textContent=JSON.stringify({silent:true,time:+w.time.toFixed(2),hp:w.player.hp,enemies:w.enemies.map(e=>({role:e.infantry.kind,state:e.infantry.state,x:+e.x.toFixed(2),y:+e.y.toFixed(2),hp:e.hp,ammo:e.infantry.ammo,reload:+e.infantry.reloading.toFixed(1),fuse:+e.infantry.fuse.toFixed(2)})),events:log.slice(-8)});};base();addInfantry(w,'rifle',31);await view.init();view.reset(w);
</script></html>
