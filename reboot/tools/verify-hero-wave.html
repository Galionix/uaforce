<!doctype html><meta charset="utf-8"><title>UA Force — pixel roster check</title><style>body{background:#1b3028;color:#f4dfad;font:16px monospace}canvas{image-rendering:pixelated;width:720px;height:500px}p{max-width:720px}</style><p>Тиха перевірка: оригінальна поза й вісім фаз бігу. Та сама палітра, обрізка та анімація, що у грі.</p><canvas width="360" height="250"></canvas><output>Завантаження…</output><script type="module">
import{HEROES}from'/src/game/content.ts';import{NEW_HEROES}from'/src/game/hero-expansion.ts';import{actorBounds}from'/src/game/sprite-bounds.ts';import{buildHeroRunFrames,RUN_RIGS}from'/src/game/hero-run.ts';import{importAbilityPixels}from'/src/game/ability-palette.ts';
const c=document.querySelector('canvas').getContext('2d');c.imageSmoothingEnabled=false;
for(const [i,id]of NEW_HEROES.entries()){const hero=HEROES.find(h=>h.id===id),im=new Image();im.src=hero.sheet;await im.decode();const cv=document.createElement('canvas');cv.width=192;cv.height=128;const p=cv.getContext('2d');p.imageSmoothingEnabled=false;p.drawImage(im,0,0,192,128);const pixels=p.getImageData(0,0,192,128);importAbilityPixels(pixels.data);p.putImageData(pixels,0,0);const box=actorBounds(pixels.data,192,128)[0],frames=buildHeroRunFrames(cv,box,RUN_RIGS[id]);c.fillStyle='#f4dfad';c.font='8px monospace';c.fillText(hero.name,2,i*50+8);const width=Math.round(box[2]*27/box[3]);c.drawImage(cv,...box,20-width/2,i*50+17,width,27);frames.forEach((f,n)=>c.drawImage(f,40+n*40,i*50+12));}
document.querySelector('output').textContent='5 бійців · 40 фаз · без звуку';
</script>
