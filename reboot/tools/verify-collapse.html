<!doctype html><html lang="uk"><meta charset="UTF-8"><title>UA Force — обрушення</title><style>body{background:#172b25;color:white;font:16px monospace;margin:0}button{padding:12px}canvas{width:min(100%,960px);image-rendering:pixelated}output{display:block}</style><button id="cut">Зруйнувати опору</button><button id="step">Крок 0.1 с</button><button id="reset">Заново</button><output></output><canvas></canvas><script type="module">
import {World,IDLE} from '/src/game/world.ts';import {View} from '/src/game/view.ts';
const view=new View(document.querySelector('canvas'));let w,pillar,roof;
function reset(){w=new World(0,undefined,'almaziv');w.mode='playing';w.boxes=[];w.enemies=[];w.mounts=[];w.allies=[];w.player.x=12;w.player.invulnerable=999;const add=(x,y,width,height,hp,kind='stone')=>{const b={id:w.nextId(),x,y,w:width,h:height,hp,maxHp:hp,kind};w.boxes.push(b);return b};add(20,-1,50,1,Infinity,'earth');pillar=add(17,0,1,5,50);roof=add(19,5,5,1,100);w.enemies.push({id:w.nextId(),x:19,y:0,hp:150,maxHp:150,dir:-1,cooldown:999,windup:0,anchor:19,heavy:false});view.reset(w);}
document.querySelector('#cut').onclick=()=>w.damageBox(pillar,50);document.querySelector('#step').onclick=()=>{for(let i=0;i<6;i++)w.step(1/60,IDLE);};document.querySelector('#reset').onclick=reset;
view.onFrame=dt=>{for(const e of w.events)view.event(e);w.events=[];const inv=w.player.invulnerable;w.player.invulnerable=0;view.render(w,dt,0);w.player.invulnerable=inv;document.querySelector('output').textContent=JSON.stringify({silent:true,y:roof.y,falling:roof.falling,delay:roof.collapseDelay,roofHp:roof.hp,enemyHp:w.enemies[0].hp})};reset();await view.init();
</script></html>
