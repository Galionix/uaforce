<!doctype html><html lang="uk"><meta charset="UTF-8"><title>UaForce — перевірка сцен</title><style>body{margin:0;background:#10211b;color:#fff;font:18px monospace}canvas{width:100%;image-rendering:pixelated}nav{padding:8px;display:flex;gap:8px;flex-wrap:wrap}button{padding:8px}output{padding:8px;display:block}</style><nav><button id="shevchenko">Тарас Шевченко</button><button id="lesya">Леся Українка</button><button id="franko">Іван Франко</button><button id="ability">Спецприйом</button><button id="ultimate">Ульта</button><button id="ladder">Стрибок з драбини</button><button id="evac">Евакуація</button><button id="sound">Черга та відновлення</button></nav><output id="state">Завантаження</output><canvas id="test"></canvas><script type="module">
import {View} from '/src/game/view.ts';import {World,IDLE} from '/src/game/world.ts';import {HEROES} from '/src/game/content.ts';
const view=new View(document.querySelector('canvas'));let world,scenario='hero',elapsed=0,selected='shevchenko',cast=false;
function reset(which){scenario=which;elapsed=0;cast=false;world=new World(HEROES.findIndex(h=>h.id===selected),HEROES.map(h=>h.id),selected);world.mode='playing';world.enemies=[];world.player.x=which==='evac'?90:which==='ladder'?world.ladders[0].x:6;view.reset(world);}
for(const h of HEROES.slice(0,3))document.getElementById(h.id).onclick=()=>{selected=h.id;reset('hero');};
for(const id of ['ladder','evac','sound'])document.getElementById(id).onclick=()=>{reset(id);};
for(const id of ['ability','ultimate'])document.getElementById(id).onclick=()=>{reset(id);cast=true;};
view.onFrame=dt=>{elapsed+=dt;const action={...IDLE,special:cast&&scenario==='ability',ultimate:cast&&scenario==='ultimate',climb:scenario==='ladder'&&elapsed<2.2?1:0,jump:scenario==='ladder'&&elapsed>1&&elapsed<1.05,fire:scenario==='sound'&&elapsed<1.8};cast=false;world.step(dt,action);for(const e of world.events){view.event(e);}world.events=[];view.render(world,dt,0);document.querySelector('output').textContent=`${scenario} · ${world.hero.name} · ${world.hero.special} / ${world.hero.ultimate} · форма ${world.player.form.toFixed(1)} · драбина ${world.player.ladder} · висота ${world.player.y.toFixed(2)} · ${world.evac.phase} · ${world.mode}`;};
reset('hero');await view.init();view.reset(world);
</script></html>
