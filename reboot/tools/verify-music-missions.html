<!doctype html><html lang="uk"><meta charset="utf-8"><title>Нові місії та музичні стани — без звуку</title><style>body{margin:0;background:#10232b;color:white;font:18px monospace}button{font:inherit;padding:9px}nav{display:flex;flex-wrap:wrap;gap:6px;padding:8px}output{display:block;padding:8px}canvas{width:min(100%,1280px);image-rendering:pixelated}</style><nav id="missions"></nav><nav id="sections"></nav><nav><button id="danger">Бій поруч</button><button id="calm">Прибрати загрозу</button><button id="pause">Пауза</button></nav><output></output><canvas></canvas><script type="module">
import {World,IDLE}from'/src/game/world.ts';import{MISSIONS}from'/src/game/content.ts';import{MusicMood,musicDanger}from'/src/game/music.ts';import{View}from'/src/game/view.ts';import{Sound}from'/src/game/audio.ts';const view=new View(document.querySelector('canvas')),sound=new Sound(true),mood=new MusicMood();let w,current='explore';
function scene(i,x=8){w=new World(i);w.mode='playing';w.enemies=[];w.boss=null;w.player.x=x;mood.reset();view.reset(w);document.querySelector('#sections').replaceChildren();for(const d of w.mission.districts){const b=document.createElement('button');b.textContent=d.name;b.onclick=()=>scene(i,d.start+12);document.querySelector('#sections').append(b);}}
for(const[i,m]of MISSIONS.entries()){const b=document.createElement('button');b.textContent=m.name;b.onclick=()=>scene(i);document.querySelector('#missions').append(b);}
document.querySelector('#danger').onclick=()=>w.enemies.push({id:w.nextId(),x:w.player.x+8,y:w.player.y,hp:100,maxHp:100,dir:-1,cooldown:999,windup:0,anchor:w.player.x+8,heavy:false});document.querySelector('#calm').onclick=()=>{w.enemies=[];w.bullets=[];};document.querySelector('#pause').onclick=()=>{w.mode=w.mode==='playing'?'paused':'playing';};
view.onFrame=dt=>{w.step(Math.min(dt,1/30),IDLE);if(w.mode==='playing')current=mood.step(dt,musicDanger(w),false);view.render(w,dt,0);sound.scoreTheme=w.mission.score;sound.step(dt,musicDanger(w),w.mode==='playing');w.events=[];document.querySelector('output').textContent=JSON.stringify({silent:true,mission:w.mission.name,section:w.section.name,mode:w.mode,musicSelection:w.mission.score+'-'+current,playback:false});};scene(3);await view.init();view.reset(w);
</script></html>
