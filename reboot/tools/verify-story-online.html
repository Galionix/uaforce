<!doctype html><html lang="uk"><meta charset="utf-8"><title>Сцена й камера коопу — без звуку</title><button>Перевірити мережеву сцену</button><pre>Два справжні WebRTC-клієнти. Без аудіовиходу.</pre><script type="module">
import {World,IDLE} from '/src/game/world.ts';import {OnlineRoom} from '/src/game/online.ts';import {connectionConfig} from '/src/game/ice.ts';import {SnapshotWriter,applySnapshot} from '/src/game/coop-state.ts';import {beginStory,skipStory} from '/src/game/story-scenes.ts';import {teamCamera} from '/src/game/shared-screen.ts';
let host,guest,timer,timeout;const out=document.querySelector('pre');
function close(){clearInterval(timer);clearTimeout(timeout);host?.close();guest?.close();}
document.querySelector('button').onclick=async()=>{close();let config;try{config=await connectionConfig(false);}catch{out.textContent='Сервіс з’єднання недоступний. Відкрийте тест на дозволеному порту 5178.';return;}const cameras=new Map(),w=new World();w.mode='playing';w.addPlayer('lesya');beginStory(w,'river-watch');const writer=new SnapshotWriter(w),remote=new World();let packets=0,seq=0,after=0,asked=false;const result={scene:false,exitFlag:false,guestSkip:false,controlLocked:true,sameCamera:true,restored:false,teamLimit:false,silent:true};
const done=()=>{close();out.textContent=JSON.stringify({...result,packets,passed:packets>5&&Object.values(result).every(Boolean)},null,2);};
const base={status:t=>out.textContent=t,created:()=>{},connected:()=>{},snapshot:()=>{},command:()=>{},ended:()=>{}};
host=new OnlineRoom('host',OnlineRoom.code(),'shevchenko',{...base,created:code=>{guest=new OnlineRoom('guest',code,'lesya',{...base,snapshot:s=>{packets++;applySnapshot(remote,s);result.scene ||=!!remote.story;result.exitFlag ||=remote.story?.exit!==null&&!!remote.story;result.sameCamera &&=JSON.stringify(teamCamera(remote))===cameras.get(s.sequence);if(remote.story){result.controlLocked &&=s.players.every(a=>a.body.energy===100);if(remote.story.age>1.3&&!asked){asked=true;guest.command('continue');}}else{result.restored=true;result.teamLimit ||=Math.abs(remote.players[0].body.x-remote.players[1].body.x)<=30.001&&remote.players[1].body.x>=69.99;}out.textContent=JSON.stringify(result);if(after>70&&result.restored)done();}},config);},command:c=>{if(c==='continue'){result.guestSkip=true;skipStory(w);}},connected:()=>{timer=setInterval(()=>{if(w.story)w.stepPlayers(1/60,[{...IDLE,fire:true,ultimate:true},{...IDLE,fire:true,ultimate:true}]);else{if(after++===0){w.enemies=[];w.allies=[];w.mounts=[];w.boxes=w.boxes.filter(b=>b.y<0);w.players[0].body.x=40;w.players[1].body.x=69.99;}w.stepPlayers(1/60,[IDLE,{...IDLE,move:1}]);}const snapshot=writer.snapshot(++seq,w.events);cameras.set(snapshot.sequence,JSON.stringify(teamCamera(w)));host.state(snapshot);w.events=[];},1000/60);}},config);timeout=setTimeout(done,40000);
};window.addEventListener('pagehide',close);
</script></html>
