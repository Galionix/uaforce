<!doctype html><html lang="uk"><meta charset="UTF-8"><title>UaForce — перевірка бійців</title><link rel="stylesheet" href="/src/style.css"><style>body{overflow:auto;margin:0;background:#14291f;color:#fff;font:18px monospace}canvas{width:min(100%,960px);image-rendering:pixelated}nav{display:flex;flex-wrap:wrap;gap:6px;padding:8px}button{padding:8px}output{display:block;padding:8px;font-size:12px;max-width:940px}</style><nav id="heroes"></nav><nav><button id="run">Біг зі стрільбою</button><button id="reverse">Біг ліворуч</button><button id="weapon">Зброя</button><button id="special">Спецприйом</button><button id="ultimate">Ульта</button><button id="reload">Витратити магазин</button><button id="freeze">Пауза кадру</button><button id="advance">Крок 0.2 с</button></nav><div id="ability-icons" class="abilities" style="margin:16px"></div><output id="state">Завантаження</output><canvas></canvas><script type="module">
import{View}from'/src/game/view.ts';import{World,IDLE}from'/src/game/world.ts';import{HEROES}from'/src/game/content.ts';
import {mountAbilities} from '/src/game/hud.ts';const updateAmmoHud=mountAbilities(document.querySelector('#ability-icons'));
const view=new View(document.querySelector('canvas'));let world,selected='shevchenko',elapsed=0,freeze=true,scenario='idle';
function reset(){world=new World(0,HEROES.map(h=>h.id),selected);world.mode='playing';world.player.x=65;world.player.invulnerable=999;world.enemies=world.enemies.filter(e=>e.x>=69);world.enemies.forEach(e=>e.hp=e.maxHp=1000);world.boxes=world.boxes.filter(b=>b.y<0||b.kind==='radio');if(selected==='it-army'){const radio=world.boxes.find(b=>b.kind==='radio');if(radio)radio.x=world.player.x+4;}elapsed=0;view.reset(world);}
for(const h of HEROES){const b=document.createElement('button');b.textContent=h.name;b.onclick=()=>{selected=h.id;reset();};document.querySelector('#heroes').append(b);}
for(const id of ['weapon','special','ultimate'])document.getElementById(id).onclick=()=>{reset();scenario=id;world.step(1/60,{...IDLE,fire:id==='weapon',special:id==='special',ultimate:id==='ultimate'});};
for(const id of ['run','reverse'])document.getElementById(id).onclick=()=>{reset();scenario=id;freeze=false;};
document.querySelector('#reload').onclick=()=>{reset();scenario='reload';if(world.hero.magazine){for(let i=0;i<4000&&!world.player.reloading;i++)world.step(1/60,{...IDLE,fire:world.hero.mode==='single'?!world.player.weaponTrigger:true});}freeze=true;view.reset(world);};
document.querySelector('#freeze').onclick=()=>freeze=!freeze;document.querySelector('#advance').onclick=()=>{for(let i=0;i<12;i++)world.step(1/60,IDLE);view.reset(world);};
view.onFrame=dt=>{if(!freeze){elapsed+=dt;world.step(dt,{...IDLE,move:scenario==='run'?1:scenario==='reverse'?-1:0,fire:['run','reverse'].includes(scenario)||scenario==='weapon'&&elapsed<2});}for(const e of world.events){view.event(e);}world.events=[];view.render(world,dt,scenario==='run'?1:scenario==='reverse'?-1:0);updateAmmoHud(world,['J','E','Q']);document.querySelector('#state').textContent=JSON.stringify({hero:world.heroId,scenario,mode:world.mode,paused:freeze,muted:true,followers:world.followers.map(f=>({kind:f.kind,x:+f.x.toFixed(2),y:+f.y.toFixed(2),hp:f.hp,state:f.state,ammo:f.ammo,reloading:+f.reloading.toFixed(2)})),ammo:world.player.ammo,reloading:world.player.reloading,shots:world.shots,charges:world.specialCharges,energy:Math.round(world.player.energy),effects:world.effects.map(f=>({hero:f.hero,kind:f.kind,age:+f.age.toFixed(2)})),bullets:world.bullets.length,hp:Math.round(world.player.hp),kills:world.kills,loaded:true});};reset();await view.init();view.reset(world);
</script></html>
