<!doctype html><html lang="uk"><meta charset="utf-8"><title>UaForce — перевірка презентації без звуку</title><style>body{background:#111;color:white}#tools{position:fixed;top:20px;left:20px;z-index:7;display:flex;gap:12px}#tools button{font:18px monospace}#report{position:fixed;bottom:10px;left:10px;color:white;z-index:10}</style><body><canvas id="scene"></canvas><div id="tools"><button id="hero">Відкриття героя</button><button id="boss">Фінальний бос</button><button id="walls">Стіни</button><button id="reset">Початок</button></div><pre id="report"></pre><script type="module">
import '../src/style.css';import {World,IDLE} from '../src/game/world.ts';import {View} from '../src/game/view.ts';import {Sound} from '../src/game/audio.ts';import {Cinematic} from '../src/game/cinematic.ts';import {BOSSES} from '../src/game/bosses.ts';
const canvas=document.querySelector('#scene'),view=new View(canvas),sound=new Sound(true);let world=new World(),time=0,last=0,wallTest=false;const cinematic=new Cinematic(sound,()=>{},w=>view.reset(w));await view.init();
function report(){document.querySelector('#report').textContent=JSON.stringify({silent:true,mode:world.mode,simulationTime:world.time,boss:world.boss?.boss?.id,climbing:world.player.wallClimbing,wallX:world.player.x,wallY:world.player.y,events:world.events.map(e=>e.type)});}
document.querySelector('#hero').onclick=()=>{world=new World();world.beginCinematic('hero','shevchenko');view.reset(world);cinematic.sync(world);};
document.querySelector('#boss').onclick=()=>{world=new World(5);world.mode='playing';world.player.x=BOSSES.putin.left;world.step(1/60,IDLE);view.reset(world);cinematic.sync(world);};
document.querySelector('#walls').onclick=()=>{world=new World();world.mode='playing';world.enemies=[];world.ladders=[];world.mounts=[];world.boxes=world.boxes.filter(b=>b.kind==='earth');world.boxes.push({id:9999,x:10,y:0,w:2,h:10,hp:500,maxHp:500,kind:'wall'});world.player.x=8.68;world.player.y=2;world.player.grounded=false;world.player.coyote=0;wallTest=true;view.reset(world);};
document.querySelector('#reset').onclick=()=>{world=new World();wallTest=false;view.reset(world);};
view.onFrame=dt=>{time+=dt;if(world.mode==='cinematic'){cinematic.step(dt);cinematic.sync(world);}else if(wallTest)world.step(1/60,{...IDLE,move:world.player.x<10?1:0,jumpHeld:true});view.render(world,dt,wallTest?1:0);report();};view.reset(world);report();
</script></body></html>
