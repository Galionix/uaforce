<!doctype html><html lang="uk"><meta charset="utf-8"><title>Підказки й п’ятюня — без звуку</title><style>#qa{position:fixed;top:6px;left:6px;z-index:20}button{font:15px monospace;padding:5px}output{position:fixed;bottom:3px;z-index:20;background:#112024;color:white;font:14px monospace}</style><canvas id="scene"></canvas><nav id="qa"></nav><output></output><script type="module">
import '/src/style.css';import {World,IDLE} from '/src/game/world.ts';import {View} from '/src/game/view.ts';import {addMount} from '/src/game/mounts.ts';import {addInfantry} from '/src/game/infantry.ts';import {interactionTarget} from '/src/game/interactions.ts';
const view=new View(document.querySelector('canvas'));view.interactKey='□';let w,run=false,move=0;
function setup(kind='team'){w=new World();w.mode='playing';w.storyDone=['river-watch'];w.boxes=w.boxes.filter(b=>b.y<0);w.enemies=[];w.allies=[];w.mounts=[];w.medkits=[];w.ammoCrates=[];w.ladders=[];w.player.x=16;w.player.invulnerable=999;move=0;run=false;if(kind==='team'){w.addPlayer('lesya');const e=addInfantry(w,'rifle',27);e.dir=-1;}if(kind==='barrel')w.boxes.push({id:w.nextId(),x:17,y:0,w:1,h:1,hp:25,maxHp:25,kind:'barrel'});if(kind==='tank')addMount(w,18);view.reset(w);}
function step(a=IDLE,b=IDLE){w.stepPlayers(1/60,[a,b]);for(const e of w.events)view.event(e);w.events=[];view.render(w,1/60,move);}
function button(name,fn){const b=document.createElement('button');b.textContent=name;b.onclick=fn;document.querySelector('#qa').append(b);}
button('Двоє',()=>setup());button('Бочка',()=>setup('barrel'));button('Танк',()=>setup('tank'));button('P1 · □',()=>{step();step({...IDLE,interact:true});});button('P2 · □',()=>{step();step(IDLE,{...IDLE,interact:true});});button('Крок 0.15 с',()=>{for(let i=0;i<9;i++)step();});button('Крок 1 с',()=>{for(let i=0;i<60;i++)step();});button('Рух / пауза',()=>run=!run);button('Клавіатура / геймпад',()=>view.interactKey=view.interactKey==='□'?'F':'□');
view.onFrame=()=>{if(run)step({...IDLE,move});view.render(w,0,0);document.querySelector('output').textContent=JSON.stringify({silent:true,hint:interactionTarget(w),boost:w.highFive,hp:w.player.hp,barrels:w.boxes.filter(b=>b.kind==='barrel').map(b=>({x:b.x,y:b.y,hp:b.hp}))});};await view.init();setup();
</script></html>
