<!doctype html><html lang="uk"><meta charset="UTF-8"><title>Тайра — бойова перевірка</title><style>body{margin:0;background:#172b25;color:white;font:16px monospace}button{padding:12px}canvas{width:min(100%,960px);image-rendering:pixelated}output{display:block;padding:8px;max-width:960px}</style><nav><button id="reset">Скинути</button><button id="arc">Розряд</button><button id="reload">3 постріли</button><button id="prime">Ульта: підготовка</button><button id="blast">Ульта: вибух</button><button id="aid">Медпункт</button><button id="step">Крок 0.1 с</button><button id="second">Крок 1 с</button></nav><output></output><canvas></canvas><script type="module">
import{World,IDLE}from'/src/game/world.ts';import{View}from'/src/game/view.ts';import{addInfantry}from'/src/game/infantry.ts';
const view=new View(document.querySelector('canvas'));let w,scenario;
function flat(){w=new World(0,['taira'],'taira');w.mode='playing';w.enemies=[];w.mounts=[];w.allies=[];w.ladders=[];w.ammoCrates=[];w.boxes=[{id:w.nextId(),x:24,y:-1,w:70,h:1,hp:Infinity,maxHp:Infinity,kind:'earth'}];w.player.x=20;w.player.invulnerable=999;for(const x of[23,25,27,30]){const e=addInfantry(w,'gunner',x);e.hp=e.maxHp=1000;e.infantry.reaction=999;e.infantry.memory=999;e.infantry.lastX=x;}view.reset(w);scenario='ready';}
const frames=(n,a=IDLE)=>{for(let i=0;i<n;i++)w.step(1/60,a);};const click=(id,fn)=>document.getElementById(id).onclick=fn;
click('reset',flat);click('arc',()=>{scenario='arc';frames(26);frames(1,{...IDLE,fire:true});});click('reload',()=>{flat();scenario='reloading';for(let i=0;i<3;i++){frames(26);frames(1,{...IDLE,fire:true});}});click('prime',()=>{scenario='charging';frames(1,{...IDLE,ultimate:true});frames(9);});click('blast',()=>{flat();scenario='marked overload';frames(1,{...IDLE,fire:true});frames(1,{...IDLE,ultimate:true});frames(25);});click('aid',()=>{flat();scenario='aid';w.player.hp=30;w.enemies=[];frames(1,{...IDLE,special:true});frames(10);});click('step',()=>frames(6));click('second',()=>frames(60));
view.onFrame=dt=>{for(const e of w.events)view.event(e);w.events=[];const inv=w.player.invulnerable;w.player.invulnerable=0;view.render(w,dt,0);w.player.invulnerable=inv;document.querySelector('output').textContent=JSON.stringify({silent:true,scenario,ammo:w.player.ammo,reloading:w.player.reloading,hp:w.player.hp,targets:w.enemies.map(e=>({hp:e.hp,mark:e.ionized})),effects:w.effects.map(f=>({kind:f.kind,age:f.age,links:f.links?.length,power:f.power}))});};flat();await view.init();
</script></html>
