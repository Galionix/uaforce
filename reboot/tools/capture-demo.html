<!doctype html><html lang="uk"><meta charset="utf-8"><title>UA Force — тихий запис ігрового моменту</title><style>body{background:#14221c;color:#ffe395;font:20px monospace}canvas{width:min(960px,96vw);image-rendering:pixelated;display:block}button{font:inherit;padding:12px}</style><button id="record" disabled>Записати 7 секунд</button><button id="still" disabled>Зберегти кадр</button><p id="status">Завантаження. Звуку немає.</p><canvas id="scene"></canvas><script type="module">
import {World,IDLE} from '/src/game/world.ts';import {View} from '/src/game/view.ts';import {HEROES} from '/src/game/content.ts';
const canvas=document.querySelector('canvas'),view=new View(canvas),status=document.querySelector('#status');let w=new World(0,HEROES.map(h=>h.id)),recording=false,time=0;
function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}
view.onFrame=dt=>{if(recording){const before=time;time+=dt;w.step(dt,{...IDLE,move:time<5?1:0,fire:true,jump:Math.floor(before/.8)!==Math.floor(time/.8),jumpHeld:true,special:before<1&&time>=1,ultimate:before<3&&time>=3});for(const e of w.events)view.event(e);w.events=[];}view.render(w,dt,recording?1:0);};
await view.init();view.reset(w);document.querySelectorAll('button').forEach(b=>b.disabled=false);status.textContent='Готово. Постановочний запис реальної симуляції, без звуку.';
document.querySelector('#record').onclick=()=>{if(recording)return;w=new World(0,HEROES.map(h=>h.id));w.player.x=26;w.player.y=4;w.player.invulnerable=100;w.mode='playing';view.reset(w);time=0;
 const type=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));if(!type){status.textContent='Запис відео недоступний. Збережіть кадр.';return;}
 const stream=canvas.captureStream(30),recorder=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:3000000}),chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{download(new Blob(chunks,{type}),'uaforce-shevchenko-2026-09-09.'+(type.includes('mp4')?'mp4':'webm'));stream.getTracks().forEach(t=>t.stop());recording=false;w.mode='paused';status.textContent='Запис збережено. 7 секунд, без аудіодоріжки.';};recording=true;recorder.start();status.textContent='Запис…';setTimeout(()=>recorder.stop(),7000);
};
document.querySelector('#still').onclick=()=>canvas.toBlob(blob=>download(blob,'uaforce-gameplay-2026-09-09.png'));
window.addEventListener('pagehide',()=>view.dispose());
</script></html>
