<!doctype html><html lang="uk"><meta charset="UTF-8"><title>UA Force — Кличко та склад</title><style>body{background:#172b25;color:white;font:16px monospace;margin:0}button{padding:12px}canvas{width:min(100%,960px);image-rendering:pixelated}output{display:block;padding:8px;max-width:950px}</style><nav><button id="usyk">Усик: ціль нижче</button><button id="hit">Удар Усика</button><button id="charge">Кличко: заряд</button><button id="release">Відпустити</button><button id="upper">Аперкот</button><button id="slam">Нокаут</button><button id="depot">Склад</button><button id="cut">Збити опори</button><button id="medic">Тайра: медпункт</button><button id="tap">Тайра: поштовх</button><button id="step">Крок 0.1 с</button><button id="second">Крок 1 с</button></nav><output></output><canvas></canvas><script type="module">
import {World,IDLE} from '/src/game/world.ts';import {View} from '/src/game/view.ts';import {addVehicle} from '/src/game/enemies.ts';import {addInfantry} from '/src/game/infantry.ts';import {meleeStrike} from '/src/game/hero-expansion.ts';import {MISSIONS} from '/src/game/content.ts';
const view=new View(document.querySelector('canvas'));let w,target,scenario;
function flat(hero='klychko'){w=new World(0,[hero],hero);w.mode='playing';w.enemies=[];w.mounts=[];w.allies=[];w.ladders=[];w.boxes=[{id:w.nextId(),x:20,y:-1,w:60,h:1,hp:Infinity,maxHp:Infinity,kind:'earth'}];w.player.x=20;w.player.invulnerable=999;target=addInfantry(w,'rifle',22);target.hp=target.maxHp=1000;target.infantry.reaction=100;target.infantry.memory=100;target.infantry.lastX=22;view.reset(w);}
function frames(n,a=IDLE){for(let i=0;i<n;i++)w.step(1/60,a);}
const click=(id,fn)=>document.getElementById(id).onclick=fn;
click('usyk',()=>{scenario='exposed hull';flat('usyk');w.player.x=10;w.boxes=[{id:w.nextId(),x:11,y:-.25,w:6,h:.25,hp:Infinity,maxHp:Infinity,kind:'platform'}];w.enemies=[];target=addVehicle(w,'tank',13,-1);target.vehicle.active=true;view.reset(w);});
click('hit',()=>meleeStrike(w,38,2.8));click('charge',()=>{scenario='charge';flat();frames(60,{...IDLE,fire:true});});click('release',()=>frames(1));
click('upper',()=>{scenario='uppercut';flat();frames(1,{...IDLE,special:true});frames(8);});click('slam',()=>{scenario='slam';flat();frames(1,{...IDLE,ultimate:true});frames(20);});
click('depot',()=>{scenario='depot';w=new World(MISSIONS.findIndex(m=>m.name==='Планове займання'),undefined,'almaziv');w.mode='playing';w.player.x=91;w.player.y=5;w.player.invulnerable=999;w.enemies=[];w.mounts=[];target=null;view.reset(w);});
click('medic',()=>{scenario='medic';flat('taira');w.enemies=[];w.player.hp=40;const a=w.addPlayer('usyk');a.body.x=22;a.body.hp=30;frames(1,{...IDLE,special:true});});click('tap',()=>{scenario='medic tap';flat('taira');target.hp=target.maxHp=96;frames(1,{...IDLE,fire:true});});
click('cut',()=>{for(const b of w.boxes)if(b.y===0&&(b.x===90.5||b.x===103.5)&&b.kind==='stone')w.damageBox(b,50);frames(1);});click('step',()=>frames(6));click('second',()=>frames(60));
view.onFrame=dt=>{for(const e of w.events)view.event(e);w.events=[];const inv=w.player.invulnerable;w.player.invulnerable=0;view.render(w,dt,0);w.player.invulnerable=inv;document.querySelector('output').textContent=JSON.stringify({silent:true,scenario,charge:w.player.klychkoHold,shots:w.shots,playerY:w.player.y,targetHp:target?.hp,targetY:target?.y,health:w.players.map(a=>a.body.hp),effects:w.effects.filter(f=>['klychko','taira'].includes(f.hero)).map(f=>({kind:f.kind,age:f.age,impactAge:f.impactAge})),deck:w.boxes.filter(b=>b.kind==='stone'&&b.x>=89&&b.x<=105&&b.collapseDelay>0).length,arsenal:w.boxes.find(b=>b.sabotage==='ammo'&&b.x===96)?.hp});};flat();await view.init();
</script></html>
