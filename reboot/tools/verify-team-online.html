<!doctype html><html lang="uk"><meta charset="utf-8"><title>Мережева п’ятюня — без звуку</title><button>Перевірити п’ятюню гостя</button><pre>Два справжні клієнти. Без аудіовиходу.</pre><script type="module">
import {World,IDLE} from '/src/game/world.ts';import {OnlineRoom} from '/src/game/online.ts';import {connectionConfig} from '/src/game/ice.ts';import {SnapshotWriter,applySnapshot} from '/src/game/coop-state.ts';
let host,guest,timer,timeout;const out=document.querySelector('pre');function close(){clearInterval(timer);clearTimeout(timeout);host?.close();guest?.close();}
document.querySelector('button').onclick=async()=>{close();let config;try{config=await connectionConfig(false);}catch{out.textContent='ICE недоступний; перевірте порт 5178.';return;}const w=new World();w.mode='playing';w.storyDone=['river-watch'];w.enemies=[];w.mounts=[];w.allies=[];w.boxes=w.boxes.filter(b=>b.y<0);w.addPlayer('lesya');const writer=new SnapshotWriter(w),remote=new World();let seq=0,packets=0,events=0,boost=false,synced=true,offered=false,premature=false;const done=()=>{close();out.textContent=JSON.stringify({packets,events,boost,synced,offered,premature,silent:true,passed:packets>10&&events===1&&boost&&synced&&offered&&!premature});};const base={status:t=>out.textContent=t,created:()=>{},connected:()=>{},snapshot:()=>{},command:()=>{},ended:()=>{}};
host=new OnlineRoom('host',OnlineRoom.code(),'shevchenko',{...base,created:code=>{guest=new OnlineRoom('guest',code,'lesya',{...base,snapshot:s=>{packets++;applySnapshot(remote,s);offered ||= remote.highFive.offeredBy===0;premature ||= packets<30&&remote.highFive.left>0;boost ||= remote.highFive.left>0;events+=s.events.filter(e=>e.type==='highFive').length;synced &&= JSON.stringify(remote.highFive)===JSON.stringify(s.state.highFive);guest.input({...IDLE,interact:packets>=30});if(packets>=100)done();}},config);},connected:()=>{timer=setInterval(()=>{w.stepPlayers(1/60,[{...IDLE,interact:seq===0},host.remote.take(performance.now()/1000)]);host.state(writer.snapshot(++seq,w.events));w.events=[];},1000/60);}},config);timeout=setTimeout(done,30000);};window.addEventListener('pagehide',close);
</script></html>
