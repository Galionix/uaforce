<!doctype html><html lang="uk"><meta charset="utf-8"><title>Заставки та боси — без звуку</title><style>body{background:#101a24;color:#ffe6bc;font:18px monospace;margin:12px}nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;padding:8px}canvas{width:min(100%,1280px);image-rendering:pixelated}output{display:block;padding:12px}#gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}figure{margin:0}figure img{width:100%}</style><nav><button id="unlock">Відкрити Лесю</button><button id="repeat">Знайомий боєць</button><button id="iron">Залізний Наглядач</button><button id="swarm">Володар Рою</button><button id="win">Здолати боса</button><button id="damage">Друга фаза</button><button id="art">Усі ілюстрації</button></nav><output></output><canvas id="scene" tabindex="0"></canvas><div id="gallery"></div><script type="module">
import '/src/style.css';import{World,IDLE}from'/src/game/world.ts';import{HEROES}from'/src/game/content.ts';import{BOSSES}from'/src/game/bosses.ts';import{Cinematic}from'/src/game/cinematic.ts';import{Sound}from'/src/game/audio.ts';import{View}from'/src/game/view.ts';import{Input}from'/src/game/input.ts';
const canvas=document.querySelector('canvas'),view=new View(canvas),input=new Input(canvas),sound=new Sound(true);let world=new World(),frozenTime=0;
const cinematic=new Cinematic(sound,()=>input.clear(),w=>view.reset(w));
function reveal(i){world=new World(i,HEROES.map(h=>h.id),'shevchenko');world.mode='playing';world.player.x=BOSSES[world.mission.boss].left;world.step(1/60,IDLE);frozenTime=world.time;cinematic.sync(world);}
document.querySelector('#iron').onclick=()=>reveal(1);document.querySelector('#swarm').onclick=()=>reveal(2);
document.querySelector('#unlock').onclick=()=>{world=new World();world.mode='playing';world.player.x=world.allies[0].x;world.step(1/60,{...IDLE,interact:true});frozenTime=world.time;cinematic.sync(world);};
document.querySelector('#repeat').onclick=()=>{world=new World(0,HEROES.map(h=>h.id));world.mode='playing';world.player.x=world.allies[0].x;world.step(1/60,{...IDLE,interact:true});view.reset(world);};
document.querySelector('#win').onclick=()=>{if(world.boss)world.damageEnemy(world.boss,9999);view.reset(world);};document.querySelector('#damage').onclick=()=>{if(world.boss)world.damageEnemy(world.boss,world.boss.maxHp*.4);};
document.querySelector('#art').onclick=()=>{document.querySelector('#gallery').innerHTML=[...HEROES.map(h=>h.id),...Object.keys(BOSSES)].map(id=>`<figure><img src="/assets/cinematics/${id}.png"><figcaption>${id}</figcaption></figure>`).join('');};
view.onFrame=dt=>{const f=input.poll();if(world.mode==='cinematic'){world.step(1/60,f.action);cinematic.step(dt,f.confirm||f.action.jump);}else if(document.activeElement===canvas)world.step(Math.min(dt,1/30),f.action);view.render(world,dt,f.action.move);world.events=[];document.querySelector('output').textContent=JSON.stringify({silent:true,mode:world.mode,time:+world.time.toFixed(3),frozen:world.mode==='cinematic'?world.time===frozenTime:null,boss:world.boss?{hp:world.boss.hp,phase:world.boss.boss.phase,stage:world.boss.boss.stage}:null});};await view.init();view.reset(world);
</script></html>
