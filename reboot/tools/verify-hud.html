<!doctype html><html lang="uk"><meta charset="UTF-8"><title>UaForce — перевірка іконок</title><style>body{margin:0!important;overflow:auto!important;padding:24px!important;background:#101a21!important}main{max-width:540px;margin:auto}h1{font:24px monospace!important}article{padding:16px;margin:16px 0;background:#15242d;border-left:3px solid #ffd476}h2{font:20px monospace!important}.abilities{margin:18px 0 24px;gap:20px!important}.ability-icon{width:72px!important;height:72px!important}button{font:16px monospace!important}output{display:block;font:16px monospace;margin-top:12px}p{font:16px monospace}</style><main><h1>Піксельні вміння</h1><div id="gallery"></div></main><script type="module">
import '/src/style.css';import {World,IDLE} from '/src/game/world.ts';import {HEROES} from '/src/game/content.ts';import {mountAbilities} from '/src/game/hud.ts';
const rows=HEROES.map(hero=>{const world=new World(0,HEROES.map(h=>h.id),hero.id);world.mode='playing';world.enemies=[];const el=document.createElement('article');el.innerHTML=`<h2>${hero.name}</h2><div class="abilities"></div><button>Спецприйом ${hero.name}</button> <button>Ульта ${hero.name}</button><output></output>`;document.querySelector('#gallery').append(el);const paint=mountAbilities(el.querySelector('.abilities'));el.querySelectorAll('button')[0].onclick=()=>world.step(1/60,{...IDLE,special:true});el.querySelectorAll('button')[1].onclick=()=>world.step(1/60,{...IDLE,ultimate:true});return{world,paint,el};});
let last=performance.now();function tick(now){const dt=Math.min(.03,(now-last)/1000);last=now;for(const {world,paint,el} of rows){world.step(dt,IDLE);paint(world,['J','E','Q']);el.querySelector('output').textContent=`Заряди: ${world.specialCharges}/${world.hero.specialCharges} · таймери: ${world.player.specialRecovery.map(t=>t.toFixed(1)).join(' / ')||'—'}`;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
