<!doctype html><html lang="uk"><meta charset="utf-8"><title>Нові операції — без звуку</title><style>body{margin:0;background:#142023;color:white;font:15px monospace}nav{display:flex;flex-wrap:wrap;gap:4px;padding:4px}button{padding:6px}canvas{width:100%;image-rendering:pixelated}output{display:block;padding:6px}</style><nav id="maps"></nav><nav id="spots"></nav><nav><button id="coop">Один / двоє</button><button id="blast">Вибух цілі</button><button id="finale">Фінал</button><button id="damage">Зруйнувати перекриття</button></nav><output>Завантаження…</output><canvas></canvas><script type="module">
import {World,IDLE} from '/src/game/world.ts';import {MISSIONS,HEROES} from '/src/game/content.ts';import {View} from '/src/game/view.ts';
let w,point=0,coop=false,running=false;const view=new View(document.querySelector('canvas'));view.interactKey='□';
function draw(){view.invalidate();view.render(w,0,0);document.querySelector('output').textContent=JSON.stringify({silent:true,mission:w.mission.name,point,position:{x:w.player.x,y:w.player.y},enemies:w.enemies.length,players:w.players.length});}
function spot(n){point=n;const p=w.mission.layout.route[n];for(const [i,a]of w.players.entries()){a.body.x=p.x+i;a.body.y=p.y;a.body.vy=0;}view.reset(w);for(let i=0;i<120;i++)view.render(w,1/60,0);draw();}
function select(index){running=false;w=new World(index,HEROES.map(h=>h.id));w.mode='playing';if(coop)w.addPlayer('lesya');document.querySelector('#spots').replaceChildren();w.mission.layout.route.forEach((p,n)=>{const b=document.createElement('button');b.textContent=`${n+1} · ${p.y}м`;b.onclick=()=>spot(n);document.querySelector('#spots').append(b);});spot(0);}
await view.init();MISSIONS.forEach((m,i)=>{if(!m.layout)return;const b=document.createElement('button');b.textContent=m.name;b.onclick=()=>select(i);document.querySelector('#maps').append(b);});document.querySelector('#coop').onclick=()=>{const index=w.missionIndex,n=point;coop=!coop;select(index);spot(n);};document.querySelector('#damage').onclick=()=>{for(const b of w.boxes)if(Number.isFinite(b.hp))w.damageBox(b,100000);draw();};document.querySelector('#blast').onclick=()=>{const t=w.boxes.filter(b=>b.sabotage&&b.hp>0).sort((a,b)=>Math.abs(a.x-w.player.x)-Math.abs(b.x-w.player.x))[0];if(t){for(const a of w.players){a.body.x=t.x-9;a.body.y=t.y;a.body.invulnerable=999;}w.enemies=[];w.damageBox(t,10000);view.reset(w);running=true;}};document.querySelector('#finale').onclick=()=>{if(!w.boss)return;w.enemies=[w.boss];w.boss.boss.active=true;w.player.x=252;w.player.y=0;w.player.invulnerable=999;w.damageEnemy(w.boss,99999);view.reset(w);running=true;};select(6);view.onFrame=dt=>{if(running){w.stepPlayers(Math.min(dt,1/30),w.players.map(()=>IDLE));for(const event of w.events)view.event(event);w.events=[];view.invalidate();view.render(w,dt,0);}else draw();};
</script></html>
