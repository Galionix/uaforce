<!doctype html><html lang="uk"><meta charset="utf-8"><title>Біг усіх бійців — без звуку</title><style>body{background:#142632;color:#fff;font:20px monospace}canvas{image-rendering:pixelated;border:1px solid #607080;margin:5px}button{padding:12px}label{display:inline-block;width:220px}article{display:flex;align-items:center}pre{font:14px monospace}</style><button id="pause">Рух / пауза</button><button id="flip">Ліворуч / праворуч</button><p>Ліворуч — анімація. Далі — 8 фаз із почерговою опорою ніг. Без звуку.</p><main></main><script type="module">
import {HEROES} from '/src/game/content.ts';import {actorBounds} from '/src/game/sprite-bounds.ts';import {buildHeroRunFrames,RUN_RIGS,MAVKA_RUN_RIG,runPose} from '/src/game/hero-run.ts';
const main=document.querySelector('main');let stopped=false,clock=0,dir=1;const views=[];document.querySelector('#pause').onclick=()=>stopped=!stopped;document.querySelector('#flip').onclick=()=>dir=-dir;
for(const h of [...HEROES,{id:'mavka',name:'Бойова Мавка',sheet:'/assets/mavka-pixel-sheet.png'}]){const im=new Image();im.src=h.sheet;await im.decode();const raw=document.createElement('canvas');raw.width=im.width;raw.height=im.height;const r=raw.getContext('2d');r.drawImage(im,0,0);const b=actorBounds(r.getImageData(0,0,im.width,im.height).data,im.width,im.height),frames=buildHeroRunFrames(im,b[0],h.id==='mavka'?MAVKA_RUN_RIG:RUN_RIGS[h.id]);const row=document.createElement('article');const l=document.createElement('label');l.textContent=h.name;row.append(l);for(let k=-1;k<8;k++){const c=document.createElement('canvas');c.width=40;c.height=34;c.style.width=(k<0?240:160)+'px';c.style.height=(k<0?204:136)+'px';const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;row.append(c);views.push({ctx,frames,k});}const report=document.createElement('output');report.dataset.hero=h.id;report.textContent=JSON.stringify({uniqueFrames:new Set(frames.map(c=>c.toDataURL())).size,frontFootX:frames.map((_,i)=>runPose(i).front[0]),backFootX:frames.map((_,i)=>runPose(i).back[0])});row.append(report);report.style.display='none';main.append(row);}
let last=0;function tick(now){if(!stopped)clock+=(now-last)/1000;last=now;for(const {ctx,frames,k}of views){ctx.clearRect(0,0,40,34);ctx.save();ctx.translate(dir<0?40:0,0);ctx.scale(dir,1);ctx.drawImage(frames[k<0?Math.floor(clock*16)%8:k],0,0);ctx.restore();}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
