<!doctype html><html lang="uk"><meta charset="utf-8"><title>Бочки та піксельні ефекти — без звуку</title><style>#qa{position:fixed;top:8px;left:8px;z-index:20;display:flex;gap:5px}#qa button{font:15px monospace;padding:6px}output{position:fixed;bottom:5px;left:5px;right:5px;z-index:20;background:#112024;color:white;font:14px monospace}</style><canvas id="scene"></canvas><nav id="qa"></nav><output></output><script type="module">
import {setLocale} from '/src/game/i18n.ts';import {ALL_DEATH_LINES} from '/src/game/enemy-death.ts';
import '/src/style.css';import {World,IDLE} from '/src/game/world.ts';import {View} from '/src/game/view.ts';import {Sound} from '/src/game/audio.ts';import {addInfantry} from '/src/game/infantry.ts';
const view=new View(document.querySelector('canvas')),sound=new Sound(true);let w,run=false;
function setup(){w=new World();w.mode='playing';w.boxes=w.boxes.filter(b=>b.y<0);w.enemies=[];w.allies=[];w.mounts=[];w.medkits=[];w.ammoCrates=[];w.ladders=[];w.player.x=16;w.player.y=5;w.player.invulnerable=999;w.boxes.push({id:w.nextId(),x:14,y:4.5,w:10,h:.5,hp:Infinity,maxHp:Infinity,kind:'platform'},{id:w.nextId(),x:17,y:5,w:1,h:1,hp:25,maxHp:25,kind:'barrel'});for(const x of [21,23,25]){const e=addInfantry(w,'rifle',x);e.rooted=999;}view.reset(w);run=false;}
function step(a=IDLE){w.step(1/60,a);for(const e of w.events){view.event(e);sound.event(e,w.player.x);}w.events=[];view.render(w,1/60,0);}
function button(name,fn){const b=document.createElement('button');b.textContent=name;b.onclick=fn;document.querySelector('#qa').append(b);}
let lineIndex=2;button('Українська',()=>{setLocale('uk');view.invalidate();});button('English',()=>{setLocale('en');view.invalidate();});button('Репліка',()=>{view.reset(w);view.event({type:'enemyDeath',x:21,y:2,text:ALL_DEATH_LINES[lineIndex++%ALL_DEATH_LINES.length]});});
button('Заново',setup);button('Підняти / кинути',()=>{step(IDLE);step({...IDLE,interact:true});});button('Стрибнути',()=>step({...IDLE,jump:true}));button('Скинути вниз',()=>{step(IDLE);step({...IDLE,climb:-1,interact:true});});button('Крок 0.25 с',()=>{for(let i=0;i<15;i++)step();});button('Рух / пауза',()=>run=!run);button('Черга',()=>{w.player.x=18;w.player.y=0;for(let i=0;i<60;i++)step({...IDLE,fire:true});});
view.onFrame=dt=>{if(run)step();view.render(w,0,0);document.querySelector('output').textContent=JSON.stringify({silent:true,held:w.heldBarrel,kills:w.kills,time:+w.time.toFixed(2),barrels:w.boxes.filter(b=>b.kind==='barrel').map(b=>({x:+b.x.toFixed(2),y:+b.y.toFixed(2),hp:b.hp})),enemies:w.enemies.map(e=>e.hp)});};await view.init();setup();
</script></html>
