<!doctype html><html lang="uk"><meta charset="UTF-8"><title>Танк — беззвучна перевірка</title><style>body{margin:0;background:#12252b;color:#fff;font:18px monospace}nav{padding:10px;display:flex;flex-wrap:wrap;gap:10px}button{font:inherit;padding:8px}canvas{width:min(100%,1280px);image-rendering:pixelated;outline:none}output{display:block;padding:8px}</style><nav><button id="reset">Новий танк</button><button id="hit">Влучання −90</button><button id="rocket">Ракета</button><button id="pause">Пауза / продовжити</button></nav><p>F / X — сісти / вийти · A/D / стік — рух · J / RT — гармата · пробіл / A — стрибок танка</p><output></output><canvas id="scene" tabindex="0"></canvas><script type="module">
import {World,IDLE}from'/src/game/world.ts';import {View}from'/src/game/view.ts';import {Input}from'/src/game/input.ts';import {Sound}from'/src/game/audio.ts';import {addMount,damageMount}from'/src/game/mounts.ts';
const canvas=document.querySelector('canvas'),view=new View(canvas),input=new Input(canvas),sound=new Sound(true);let w,t;
function reset(){w=new World();w.mode='playing';w.enemies=[];w.allies=[];w.boxes=w.boxes.filter(b=>b.y<0);w.mounts=[];w.player.x=12;t=addMount(w,13);w.enemies.push({id:w.nextId(),x:24,y:0,hp:300,maxHp:300,dir:-1,cooldown:999,windup:0,anchor:24,heavy:false});input.clear();view.reset(w);canvas.focus();}
document.querySelector('#reset').onclick=reset;document.querySelector('#hit').onclick=()=>{damageMount(w,t,90);view.reset(w);canvas.focus();};document.querySelector('#rocket').onclick=()=>{w.bullets.push({id:w.nextId(),x:t.x+6,y:t.y+1,vx:-16,vy:0,life:2,friendly:false,damage:100,ordnance:'rocket',blastRadius:2.8});canvas.focus();};document.querySelector('#pause').onclick=()=>{w.mode=w.mode==='playing'?'paused':'playing';canvas.focus();};
view.onFrame=dt=>{const f=input.poll();if(f.pause)w.mode=w.mode==='playing'?'paused':'playing';w.step(Math.min(dt,1/30),document.activeElement===canvas?f.action:IDLE);for(const e of w.events){view.event(e);sound.event(e,w.player.x);}w.events=[];view.render(w,dt,f.action.move);document.querySelector('output').textContent=JSON.stringify({silent:true,mode:w.mode,mounted:!!w.mounted,armor:t.armor,hp:w.player.hp,x:+t.x.toFixed(2),y:+t.y.toFixed(2),grounded:t.grounded,reload:+t.cooldown.toFixed(2),enemy:w.enemies[0].hp,prompt:w.prompt});};reset();await view.init();view.reset(w);
</script></html>
